    html, body {

      -moz-user-select: none;

    img, video {
      pointer-events: none !important;
      -webkit-user-drag: none;
    }

    .gallery, .gallery-tall, .gallery-side, .gallery-full, .hero-content .logo-wrap, header .logo {
      position: relative;
    }
    .gallery div::after, .gallery-full::after, .gallery-tall::after, .gallery-side::after, .hero-content .logo-wrap::after, header .logo::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: transparent;

    header .logo img {
      height: 110px !important;

    .btn-call-highlight {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #dfbc7c 0%, #c9a66b 50%, #9e7b43 100%);
      color: #111111 !important;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 10px 24px;
      border-radius: 6px;
      box-shadow: 0 4px 20px rgba(201, 166, 107, 0.4);
      transition: all 0.3s ease;
      text-decoration: none;
      position: relative;
      z-index: 20;
    }
    .btn-call-highlight:hover {
      transform: translateY(-2px);

      background: linear-gradient(135deg, #ebd091 0%, #dfbc7c 50%, #b38e53 100%);
    }

    .cta-phone-large {
      display: inline-block;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 700;
      color: #dfbc7c;
      letter-spacing: 0.05em;
      margin-top: 15px;
      margin-bottom: 25px;
      text-decoration: none;
      transition: opacity 0.3s;
      position: relative;
      z-index: 20;
    }
    .cta-phone-large:hover {
      opacity: 0.85;
    }

    .floating-banner-container {

      transform: translateX(-50%);

      max-width: 800px;
      height: 110px;
      z-index: 999;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .banner-card {
      flex: 1;
      background: rgba(25, 25, 25, 0.95);
      border: 1px solid #dfbc7c;
      border-radius: 8px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);

    .banner-card:hover {
      transform: translateY(-4px);
      background: rgba(35, 35, 35, 0.98);
    }
    .banner-close-btn {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 18px;
      color: #dfbc7c;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 50;
      padding: 5px;
      line-height: 1;
    }
    .banner-subtitle {
      font-size: 10px;
      letter-spacing: 1.5px;
      color: #dfbc7c;
      text-transform: uppercase;
      margin-bottom: 4px;

      font-weight: 600;
      color: #ffffff;
      line-height: 1.3;
    }
    .banner-desc {
      font-size: 11px;
      color: #aaaaaa;
      margin-top: 4px;
    }
